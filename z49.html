
<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<div style="color:red;font-size:50px;"> 
		<script language="JavaScript"> 
		function start_woj()
		{
			do
			{
			var a_woj=parseFloat(prompt('Podaj bok a = ',''));
			} while(a_woj<=0)
			do
			{
			var b_woj=parseFloat(prompt('Podaj bok b = ',''));
			} while(b_woj<=0)
			do
			{
			var c_woj=parseFloat(prompt('Podaj bok c = ',''));
			} while(c_woj<=0)
			
			if((a_woj+b_woj>c_woj)&&(a_woj+c_woj>b_woj)&&(c_woj+b_woj>a_woj))
			{
				document.write("Boki to "+a_woj+" "+b_woj+" "+c_woj)
			} else
			{
			start_woj();
			}
		}
		start_woj();
		</script> 
		</div>
	</body> 
</html>
