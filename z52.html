
<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
		<title>Przykład użycia pętli</title>
	</head>
	<body> 
		<script language="JavaScript"> 
			for ( var i_w=1; i_w<=10; i_w++) 
			{ 
				for ( var k_w=1; k_w<=i_w; k_w++) 
				{ 
				document.write("&nbsp");     
				} 
			document.write(i_w+"<br>"); 
			}
		</script> 
	</body> 
</html>
