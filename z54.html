
<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<script language="JavaScript"> 
			var a_woj=7%4+5; //kolumna
			var b_woj=6%6+20; //wiersz
			
			for(i=0;i<b_woj;i++)
			{
				document.write("*");
			}
			for(j=0;j<a_woj-2;j++)
			{
				document.write("<br>*&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*<br>");
			}
			for(i=0;i<b_woj;i++)
			{
				document.write("*");
			}
		</script> 
	</body> 
</html>
