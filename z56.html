
<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<script language="JavaScript"> 
			var a_woj=prompt('Podaj nazwisko',''); //kolumna
			a_woj=a_woj.length%4+5;
			var b_woj=prompt('Podaj imie',''); //wiersz
			b_woj=b_woj.length%6+20;
			
			for(i=0;i<b_woj;i++)
			{
				document.write("*");
			}
			for(j=0;j<a_woj-2;j++)
			{
				document.write("<br>*")
				for(k=0;k<(b_woj-2)*2;k++)
				{
					document.write("&nbsp;");
				}
				document.write("*<br>")
			}
			for(i=0;i<b_woj;i++)
			{
				document.write("*");
			}
		</script> 
	</body> 
</html>
