
<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<script language="JavaScript"> 
			do{
			var l1_t_woj=parseFloat(prompt('Podaj 1 liczbę',''));
			if(l1_t_woj<20||l1_t_woj>60){alert("1 liczba należy do przedziału <20,60>")}
			}while(l1_t_woj<20||l1_t_woj>60)
			
			
			do{
			var l2_t_woj=parseFloat(prompt('Podaj 2 liczbę',''));
			if(l2_t_woj<20||l2_t_woj>60){alert("2 liczba należy do przedziału <20,60>")}
			}while(l2_t_woj<20||l2_t_woj>60)
			
			var pocz_woj=parseFloat(prompt('Podaj początkową wartość wielkości tekstu',''));
			var tekst_woj=prompt('Podaj tekst','');
			
			
			
			if(l1_t_woj<l2_t_woj)
			{
				do{
					document.write("<p style=\"font-size:"+pocz_woj+"px; color: black;\">"+tekst_woj+"<br></p>");
					pocz_woj=pocz_woj+5;
				}while(pocz_woj<100)
			}
			
			if(l2_t_woj<l1_t_woj)
			{
				do{
					document.write("<p style=\"font-size:"+pocz_woj+"px; color: black;\"><br>"+tekst_woj+"<br></p>");
					pocz_woj=pocz_woj-5;
				}while(pocz_woj>0)
			}
			if(l2_t_woj==l1_t_woj){document.write("<p style=\"font-size:"+pocz_woj+"px; color: black;\"><br>"+tekst_woj+"<br></p>");}
		</script> 
	</body> 
</html>
